name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project and Build APK
      run: |
        PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        cd "$PROJECT_DIR"
        chmod +x gradlew || true
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
